name: Feature request
description: Propose a scoped improvement to the project.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not include credentials, private data, or identifiable health information. Maintainers review and apply approval status labels.
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What limitation or user/research need would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the smallest useful change and how it would work.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Example or evidence
      description: Provide a public or synthetic example, relevant repository area, or evidence supporting the request.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or limitations
      description: Mention workarounds, assumptions, or tradeoffs if known.
    validations:
      required: false
