name: Bug report
description: Report a reproducible problem in the repository or its documented workflows.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before submitting. Do not include personal health information, credentials, private data, or identifying details. Use synthetic or public examples.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: State what is wrong and where you observed it.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Give the smallest steps, inputs, and commands that reproduce the problem. Redact secrets and sensitive data.
      placeholder: |
        1. Run ...
        2. Use a synthetic or public input ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include a sanitized error message or relevant output when available.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant operating system, Python version, CPU/GPU, dependency file, and model/dataset version where applicable.
      placeholder: |
        OS:
        Python:
        CPU/GPU:
        Dependency file:
        Model/dataset version:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add sanitized logs or screenshots if they help. Remove tokens, personal data, and local usernames or paths.
    validations:
      required: false
